<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFTFANS NEWS</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
        }

        header h1 {
            font-size: 2.5em;
            font-weight: bold;
            color: #00bcd4;
        }

        .article-container {
            max-width: 800px;
            margin: 20px auto;
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .article-container img {
            width: 100%;
            height: auto;
            cursor: pointer;
        }

        .headline {
            padding: 15px 20px 5px 20px;
            font-size: 1.5em;
            font-weight: bold;
            color: #00bcd4;
            text-decoration: none;
            display: block;
        }

        .headline:hover {
            text-decoration: underline;
        }

        .publication-date {
            padding: 0 20px 15px 20px;
            font-size: 0.9em;
            color: #a0a0a0;
        }

        .article-content {
            display: none;
            padding: 20px;
            font-size: 1em;
            line-height: 1.6;
            color: #cfcfcf;
        }

        .article-content.expanded {
            display: block;
        }

        .article-container:hover {
            transform: scale(1.02);
            transition: transform 0.3s ease-in-out;
        }
    </style>
</head>
<body>
    <header>
        <h1>NFTFANS NEWS</h1>
    </header>

    <div id="article-container"></div>

    <script>
        function toggleArticleContent(imgElement, articleUrl) {
            const content = imgElement.nextElementSibling.nextElementSibling.nextElementSibling;
            if (content.classList.contains('expanded')) {
                content.classList.remove('expanded');
                content.innerHTML = ''; // Clear content if collapsed
            } else {
                fetch(articleUrl)
                    .then(response => response.text())
                    .then(data => {
                        content.innerHTML = data;
                        content.classList.add('expanded');
                    })
                    .catch(error => {
                        content.innerHTML = '<p>Error loading content. Please try again later.</p>';
                        content.classList.add('expanded');
                    });
            }
        }

        function openArticleInSameTab(url) {
            window.location.href = url;
        }

        // Function to load external HTML
        function loadExternalHTML(url) {
            fetch(url)
                .then(response => response.text())
                .then(html => {
                    document.getElementById('article-container').innerHTML = html;
                    // Attach event listeners to dynamically loaded elements
                    document.querySelectorAll('.article-container img').forEach(img => {
                        img.addEventListener('click', function() {
                            const articleUrl = this.getAttribute('data-article-url');
                            toggleArticleContent(this, articleUrl);
                        });
                    });

                    document.querySelectorAll('.headline').forEach(headline => {
                        headline.addEventListener('click', function(event) {
                            event.preventDefault();
                            const articleUrl = this.getAttribute('data-article-url');
                            openArticleInSameTab(articleUrl);
                        });
                    });
                })
                .catch(error => console.error('Error loading external HTML:', error));
        }

        // Load the external HTML
        loadExternalHTML('https://raw.githubusercontent.com/nftfan/news/main/divs/1.html');
    </script>
</body>
</html>
