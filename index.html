<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFTFANS NEWS</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
        }

        header h1 {
            font-size: 2.5em;
            font-weight: bold;
            color: #00bcd4;
        }

        .page-description {
            text-align: center;
            font-size: 1.2em;
            color: #b0b0b0;
            margin-bottom: 30px;
        }

        .article-container {
            max-width: 800px;
            margin: 20px auto;
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease-in-out;
        }

        .article-container img {
            width: 100%;
            height: auto;
            cursor: pointer;
        }

        .headline {
            padding: 15px 20px 5px 20px;
            font-size: 1.5em;
            font-weight: bold;
            color: #00bcd4;
        }

        .publication-date {
            padding: 0 20px 15px 20px;
            font-size: 0.9em;
            color: #a0a0a0;
        }

        .article-content {
            max-height: 0;
            overflow: hidden;
            padding: 0 20px;
            font-size: 1em;
            line-height: 1.6;
            color: #cfcfcf;
            opacity: 0;
            transition: max-height 0.5s ease, opacity 0.5s ease;
        }

        .article-content.expanded {
            max-height: none;
            opacity: 1;
        }

        .article-container:hover {
            transform: scale(1.02);
        }

        .share-buttons {
            margin: 10px 20px;
            text-align: left;
        }

        .share-buttons a {
            color: #00bcd4;
            text-decoration: none;
            margin-right: 10px;
        }

        .share-buttons a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>NFTFANS NEWS</h1>
        <div class="page-description">Click on the image to read the full article.</div>
    </header>

    <div class="article-container" id="article-1">
        <img src="https://pbs.twimg.com/media/GWzq8SvWQAMP-OS?format=jpg&name=medium" 
             alt="Article Image"
             onclick="toggleArticleContent(this, 'nfts-in-2050')">
        <div class="headline">NFTs in 2050</div>
        <div class="publication-date">Published on September 8, 2024</div>
        <div class="article-content"></div>
        <!-- Social Media Share Links -->
        <div class="share-buttons">
            <a href="https://www.facebook.com/sharer/sharer.php?u=https://news.nftfanstoken.com/?article=nfts-in-2050" target="_blank">Share on Facebook</a>
            <a href="https://twitter.com/intent/tweet?url=https://news.nftfanstoken.com/?article=nfts-in-2050&text=Check out this article: NFTs in 2050" target="_blank">Share on Twitter</a>
            <a href="https://www.linkedin.com/sharing/share-offsite/?url=https://news.nftfanstoken.com/?article=nfts-in-2050" target="_blank">Share on LinkedIn</a>
        </div>
    </div>
    
    <div class="article-container" id="article-2">
        <img src="https://pbs.twimg.com/media/GWgJJyuWgAIUnOd?format=jpg&name=medium" 
             alt="Article Image"
             onclick="toggleArticleContent(this, 'nft-market-boom-2024')">
        <div class="headline">NFT Market Booms in 2024</div>
        <div class="publication-date">Published on September 3, 2024</div>
        <div class="article-content"></div>
        <!-- Social Media Share Links -->
        <div class="share-buttons">
            <a href="https://www.facebook.com/sharer/sharer.php?u=https://news.nftfanstoken.com/?article=nft-market-boom-2024" target="_blank">Share on Facebook</a>
            <a href="https://twitter.com/intent/tweet?url=https://news.nftfanstoken.com/?article=nft-market-boom-2024&text=Check out this article: NFT Market Booms in 2024" target="_blank">Share on Twitter</a>
            <a href="https://www.linkedin.com/sharing/share-offsite/?url=https://news.nftfanstoken.com/?article=nft-market-boom-2024" target="_blank">Share on LinkedIn</a>
        </div>
    </div>

    <script>
        function toggleArticleContent(imgElement, articleId) {
            const content = imgElement.nextElementSibling.nextElementSibling.nextElementSibling;
            const currentUrl = window.location.href.split('?')[0];
            const newUrl = `${currentUrl}?article=${articleId}`;

            if (content.classList.contains('expanded')) {
                content.classList.remove('expanded');
                content.innerHTML = ''; // Clear content if collapsed
                history.replaceState(null, '', currentUrl); // Reset URL when collapsed
            } else {
                // Simulate fetching article content
                content.innerHTML = `<p>Loading content for ${articleId}...</p>`;
                content.classList.add('expanded');
                history.replaceState(null, '', newUrl); // Update the URL
            }
        }
    </script>
</body>
</html>
