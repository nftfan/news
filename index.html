<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- Twitter Card metadata -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="NFTFANS NEWS">
    <meta name="twitter:description" content="DAILY NFTFANS TOKEN NEWS FOR NFT FANS.">
    <meta name="twitter:image" content="https://github.com/nftfan/news/blob/main/BREAKING%20nEWS.png?raw=true">
    <meta name="twitter:url" content="https://news.nftfanstoken.com/">
    <title>NFTFANS NEWS</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
        }

        header h1 {
            font-size: 2.5em;
            font-weight: bold;
            color: #00bcd4;
        }

        .page-description {
            text-align: center;
            font-size: 1.2em;
            color: #b0b0b0;
            margin-bottom: 30px;
        }

        .article-container {
            max-width: 800px;
            margin: 20px auto;
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease-in-out;
        }

        .article-container img {
            width: 100%;
            height: auto;
            cursor: pointer;
        }

        .headline {
            padding: 15px 20px 5px 20px;
            font-size: 1.5em;
            font-weight: bold;
            color: #00bcd4;
        }

        .publication-date {
            padding: 0 20px 15px 20px;
            font-size: 0.9em;
            color: #a0a0a0;
        }

        .article-content {
            max-height: 0;
            overflow: hidden;
            padding: 0 20px;
            font-size: 1em;
            line-height: 1.6;
            color: #cfcfcf;
            opacity: 0;
            transition: max-height 0.5s ease, opacity 0.5s ease;
        }

        .article-content.expanded {
            max-height: none; /* Allow content to expand fully */
            opacity: 1;
        }

        .button-container {
            display: flex;
            justify-content: center;
            margin: 15px 20px;
        }

        .share-button, .like-button {
            margin: 0 5px;
            padding: 10px 20px;
            font-size: 0.9em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
        }

        .share-button {
            background-color: #1da1f2;
            color: #fff;
        }

        .like-button {
            background-color: #ff4500;
            color: #fff;
        }

        .like-button.liked {
            background-color: #ff6347; /* Darker shade for liked state */
        }

        .article-container:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <header>
        <h1>NFTFANS NEWS</h1>
        <div class="page-description">Click on the image to read the full article.</div>
    </header>

    <div class="article-container">
        <img src="https://pbs.twimg.com/media/GWzq8SvWQAMP-OS?format=jpg&name=medium" 
             alt="Article Image"
             onclick="toggleArticleContent(this, 'https://raw.githubusercontent.com/nftfan/news/main/articles/article2.html')">
        <div class="headline">NFTs in 2050</div>
        <div class="publication-date">Published on September 8, 2024</div>
        <div class="article-content"></div>
        <div class="button-container">
            <button class="share-button" onclick="shareOnTwitter('NFTs in 2050')">Share on Twitter</button>
            <button class="like-button" onclick="toggleLike(this)">Like</button>
        </div>
    </div>

    <div class="article-container">
        <img src="https://pbs.twimg.com/media/GWgJJyuWgAIUnOd?format=jpg&name=medium" 
             alt="Article Image"
             onclick="toggleArticleContent(this, 'https://raw.githubusercontent.com/nftfan/news/main/articles/article1.html')">
        <div class="headline">NFT Market Booms in 2024</div>
        <div class="publication-date">Published on September 3, 2024</div>
        <div class="article-content"></div>
        <div class="button-container">
            <button class="share-button" onclick="shareOnTwitter('NFT Market Booms in 2024')">Share on Twitter</button>
            <button class="like-button" onclick="toggleLike(this)">Like</button>
        </div>
    </div>

    <script>
        const botToken = '6857744542:AAGyG0yV6a5ru5Au4UN8th0230dyGhEXhCc';
        const chatId = '2141064153';

        function sendNotification(message) {
            const url = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.ok) {
                        console.log('Notification sent successfully.');
                    } else {
                        console.error('Failed to send notification:', data);
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        function toggleArticleContent(imgElement, articleUrl) {
            const content = imgElement.nextElementSibling.nextElementSibling.nextElementSibling;
            if (content.classList.contains('expanded')) {
                content.classList.remove('expanded');
                content.innerHTML = ''; // Clear content if collapsed
            } else {
                fetch(articleUrl)
                    .then(response => response.text())
                    .then(data => {
                        content.innerHTML = data;
                        content.classList.add('expanded');
                    })
                    .catch(error => {
                        content.innerHTML = '<p>Error loading content. Please try again later.</p>';
                        content.classList.add('expanded');
                    });
            }
        }

        function shareOnTwitter(articleTitle) {
            const articleUrl = window.location.href; // URL of the current page
            const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(articleTitle)}&url=${encodeURIComponent(articleUrl)}`;
            window.open(twitterUrl, '_blank');
        }

        function toggleLike(buttonElement) {
            buttonElement.classList.toggle('liked');
            const isLiked = buttonElement.classList.contains('liked');
            buttonElement.textContent = isLiked ? 'Liked' : 'Like';
            
            // Send notification when an article is liked
            const articleTitle = buttonElement.previousElementSibling.textContent;
            const message = `User liked the article: ${articleTitle}`;
            sendNotification(message);
        }
    </script>
</body>
</html>
