<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFTFANS NEWS</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
        }

        header h1 {
            font-size: 2.5em;
            font-weight: bold;
            color: #00bcd4;
        }

        .article-container {
            max-width: 800px;
            margin: 20px auto;
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease-in-out;
        }

        .article-container img {
            width: 100%;
            height: auto;
            cursor: pointer;
        }

        .headline {
            padding: 15px 20px 5px 20px;
            font-size: 1.5em;
            font-weight: bold;
            color: #00bcd4;
            text-decoration: none;
            display: block;
        }

        .headline:hover {
            text-decoration: underline;
        }

        .publication-date {
            padding: 0 20px 15px 20px;
            font-size: 0.9em;
            color: #a0a0a0;
        }

        .article-content {
            max-height: 0;
            overflow: hidden;
            padding: 0 20px;
            font-size: 1em;
            line-height: 1.6;
            color: #cfcfcf;
            opacity: 0;
            transition: max-height 0.5s ease, opacity 0.5s ease;
        }

        .article-content.expanded {
            max-height: 500px; /* Adjust based on content height */
            opacity: 1;
        }

        .article-container:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <header>
        <h1>NFTFANS NEWS</h1>
    </header>

    <div class="article-container">
        <img src="https://github.com/nftfan/news/blob/main/images/Untitled%20design%20(7).png?raw=true" 
             alt="Article Image"
             onclick="toggleArticleContent(this, 'https://raw.githubusercontent.com/nftfan/news/main/articles/article1.html')">
        <a href="https://news.nftfanstoken.com/2024/09/03/nft-market-booms-in-2024.html" 
           class="headline" 
           target="_blank">NFT Market Booms in 2024</a>
        <div class="publication-date">Published on September 3, 2024</div>
        <div class="article-content"></div>
    </div>

    <script>
        function toggleArticleContent(imgElement, articleUrl) {
            const content = imgElement.nextElementSibling.nextElementSibling.nextElementSibling;
            if (content.classList.contains('expanded')) {
                content.classList.remove('expanded');
                content.innerHTML = ''; // Clear content if collapsed
            } else {
                fetch(articleUrl)
                    .then(response => response.text())
                    .then(data => {
                        content.innerHTML = data;
                        content.classList.add('expanded');
                    })
                    .catch(error => {
                        content.innerHTML = '<p>Error loading content. Please try again later.</p>';
                        content.classList.add('expanded');
                    });
            }
        }
    </script>
</body>
</html>
